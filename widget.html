<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Метеостанция — ветер и температура (Rightech)</title>
<style>
  :root{
    --bg:#0f1420;
    --panel:#161d2e;
    --panel-2:#1d2740;
    --line:#2a3550;
    --text:#e8edf7;
    --muted:#8b9ab8;
    --accent:#ffb020;
    --ok:#38d39f;
    --err:#ff6b6b;
    --panel-w:340px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1400px 800px at 40% -10%, #1b2740 0%, var(--bg) 60%);
    color:var(--text);
    font:15px/1.45 "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x:hidden;
  }
  .app{display:flex;min-height:100vh;align-items:stretch}

  .stage{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:18px 22px;
  }
  .head{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .head h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
  .head .hint{font-size:12.5px;color:var(--muted)}
  .badge{
    font-size:11px;color:var(--muted);border:1px solid var(--line);
    padding:2px 8px;border-radius:999px;white-space:nowrap;margin-left:10px;
  }

  .row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    align-items:stretch;
  }
  .gauge{
    display:flex;flex-direction:column;gap:10px;min-width:0;
    background:linear-gradient(180deg, #141b2b 0%, #0e1421 100%);
    border-radius:18px;
    box-shadow:0 16px 44px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.05);
    padding:14px;
  }
  .gauge__title{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
  }

  .dial-wrap{position:relative;width:100%;margin:0 auto;aspect-ratio:1389/1290}
  .dir-wrap{aspect-ratio:400/330}
  .dir-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #dirPointer{
    transform-origin:200px 165px;
    transition:transform .9s cubic-bezier(.22,.68,.24,1);
  }

  .speed-wrap{
    position:relative;width:100%;
    aspect-ratio:400/330;
  }
  .speed-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .speed-value{
    position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;
  }
  .speed-value__num{
    font-size:clamp(26px, 5.6vh, 56px);font-weight:700;color:var(--accent);
    line-height:1;font-variant-numeric:tabular-nums;
  }
  .speed-value__num small{font-size:.42em;font-weight:600;margin-left:4px;color:var(--muted)}
  .speed-value__cap{
    margin-top:4px;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);
  }

  .chart-card{
    background:linear-gradient(180deg, #141b2b 0%, #0e1421 100%);
    border-radius:18px;
    box-shadow:0 16px 44px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.05);
    padding:14px 16px 10px;
  }
  .chart-card__head{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-bottom:6px;flex-wrap:wrap;
  }
  .chart-card__head h2{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0;font-weight:600;
  }
  .chart-card__last{
    font-size:22px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .chart-card__last small{font-size:.55em;color:var(--muted);margin-left:4px;font-weight:600}
  .chart-wrap{position:relative;width:100%;aspect-ratio:1000/260}
  .chart-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  .table-card{
    margin-top:18px;
    background:linear-gradient(180deg, #141b2b 0%, #0e1421 100%);
    border-radius:18px;
    box-shadow:0 16px 44px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.05);
    padding:14px 16px 12px;
  }
  .table-ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .table-ctl label{margin:0;white-space:nowrap}
  .table-ctl select{width:auto;padding:5px 8px;font-size:12px}
  .table-scroll{max-height:380px;overflow:auto;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  .table-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;width:100%;background:none;border:none;padding:0;color:inherit;text-align:left}
  .table-toggle:hover{opacity:.85}
  .table-arrow{margin-left:auto;flex-shrink:0;width:20px;height:20px;opacity:.55;transition:transform .25s}
  .table-card.open .table-arrow{transform:rotate(180deg);opacity:.9}
  .table-body-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
  .table-body-wrap>div{overflow:hidden}
  .table-card.open .table-body-wrap{grid-template-rows:1fr}

  .data-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
  .data-table th{
    position:sticky;top:0;background:#182036;color:var(--muted);
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
    text-align:right;padding:10px 16px;white-space:nowrap;
  }
  .data-table th:first-child,.data-table td:first-child{text-align:left}
  .data-table td{text-align:right;padding:7px 16px;border-top:1px solid rgba(255,255,255,.05);color:#e8edf7}
  .data-table tbody tr:hover td{background:rgba(255,255,255,.035)}
  .data-table td.t-time{color:var(--muted)}
  .data-table td.t-time small{margin-left:6px;opacity:.7}
  .data-table td.t-temp,.data-table td.t-speed{color:var(--accent);font-weight:600}
  .data-table td.t-dir small{color:var(--muted);margin-left:6px}
  .data-table td.t-press,.data-table td.t-hum{color:#a0b4d8}
  .data-table td.empty{text-align:center;color:var(--muted);padding:22px}

  .status{text-align:center;font-size:13px;color:var(--muted);min-height:20px}
  .status.is-ok{color:var(--ok)}
  .status.is-err{color:var(--err)}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="head">
      <div>
        <h1>Метеостанция<span class="badge" id="modeBadge">онлайн</span></h1>
        <div class="hint" id="headHint">данные Rightech</div>
      </div>
    </div>

    <div class="row">
      <div class="gauge">
        <div class="gauge__title">Направление ветра</div>
        <div class="dial-wrap dir-wrap" id="dialWrap">
          <svg id="needleSvg" viewBox="0 0 400 330" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        </div>
        <div hidden>
          <div id="dialDeg"></div>
          <div id="value"></div><span id="dirText"></span><small id="dirFull"></small>
        </div>
      </div>

      <div class="gauge">
        <div class="gauge__title">Скорость ветра</div>
        <div class="speed-wrap" id="speedWrap">
          <svg id="speedSvg" viewBox="0 0 400 330" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          <div class="speed-value">
            <div class="speed-value__num" id="speedNum">—<small id="speedUnitSmall">м/с</small></div>
            <div class="speed-value__cap">скорость ветра</div>
          </div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card__head">
        <h2>Температура · последние <span id="chartPointsLabel">120</span> точек</h2>
        <div class="chart-card__last" id="chartLast">—<small>°C</small></div>
      </div>
      <div class="chart-wrap">
        <svg id="tempSvg" viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <div class="status" id="status">Данные Rightech</div>
    </div>

    <div class="table-card" id="tableCard">
      <button class="table-toggle" id="tableToggle" aria-expanded="false">
        <span>ДАННЫЕ ЗА 6 ЧАСОВ · <span id="tableInfo">нет данных</span></span>
        <div class="table-ctl" onclick="event.stopPropagation()">
          <label for="tableStep">Шаг</label>
          <select id="tableStep">
            <option value="0">все записи</option>
            <option value="1">1 мин</option>
            <option value="5">5 мин</option>
            <option value="10">10 мин</option>
            <option value="30">30 мин</option>
          </select>
        </div>
        <svg class="table-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <polyline points="4,7 10,13 16,7"/>
        </svg>
      </button>
      <div class="table-body-wrap">
        <div>
          <div class="table-scroll" style="margin-top:10px">
            <table class="data-table">
              <thead><tr>
                <th>Время</th><th id="thTemp">Темп.</th><th>Направление</th><th id="thSpeed">Скор.</th><th id="thPress">Давл.</th><th>Влажность, %</th>
              </tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
"use strict";
/* =========================================================================
   Метеостанция: компас + спидометр (верх) и график температуры (низ).
   Данные приходят из Python через window.__CUR__ / window.__HIST__.
   ========================================================================= */

const CUR  = window.__CUR__  || {};
const HIST = window.__HIST__ || [];

const RU = ["С","ССВ","СВ","ВСВ","В","ВЮВ","ЮВ","ЮЮВ","Ю","ЮЮЗ","ЮЗ","ЗЮЗ","З","ЗСЗ","СЗ","ССЗ"];
const el = (id) => document.getElementById(id);
const ui = {
  wrap: el("dialWrap"), svg: el("needleSvg"), dialDeg: el("dialDeg"),
  value: el("value"), dirText: el("dirText"), dirFull: el("dirFull"),
  status: el("status"), badge: el("modeBadge"), headHint: el("headHint"),
  pivotX: el("pivotX"), pivotY: el("pivotY"), needleLen: el("needleLen"), needleBase: el("needleBase"),
  speedMax: el("speedMax"), speedRed: el("speedRed"), speedUnit: el("speedUnit"),
  speedSvg: el("speedSvg"), speedNum: el("speedNum"),
  tempLimit: el("tempLimit"), tempUnit: el("tempUnit"),
  tempSvg: el("tempSvg"), chartLast: el("chartLast"), chartPointsLabel: el("chartPointsLabel"),
  tableToggle: el("tableToggle"), tableCard: el("tableCard"),
  tableBody: el("tableBody"), tableInfo: el("tableInfo"), tableStep: el("tableStep"),
  thTemp: el("thTemp"), thSpeed: el("thSpeed"), thPress: el("thPress"),
  pressUnit: el("pressUnit"), tableMinStep: el("tableMinStep"),
};

// hidden-поля управления (значения по умолчанию)
(function ensureHidden() {
  const need = { pivotX:"51", pivotY:"50.2", needleLen:"34", needleBase:"0",
                 speedMax:"50", speedRed:"30" };
  for (const [id, val] of Object.entries(need)) {
    if (!ui[id]) {
      const inp = document.createElement("input");
      inp.id = id; inp.type = "hidden"; inp.value = val;
      document.body.appendChild(inp); ui[id] = inp;
    }
  }
  if (!ui.speedUnit) {
    const sel = document.createElement("select"); sel.id = "speedUnit";
    sel.innerHTML = '<option value="ms">м/с</option><option value="kmh">км/ч</option>';
    document.body.appendChild(sel); ui.speedUnit = sel;
  }
  if (!ui.tempUnit) {
    const sel = document.createElement("select"); sel.id = "tempUnit";
    sel.innerHTML = '<option value="c">°C</option><option value="f">°F</option>';
    document.body.appendChild(sel); ui.tempUnit = sel;
  }
  if (!ui.pressUnit) {
    const sel = document.createElement("select"); sel.id = "pressUnit";
    sel.innerHTML = '<option value="hpa">гПа</option><option value="mmhg">мм</option>';
    document.body.appendChild(sel); ui.pressUnit = sel;
  }
  if (!ui.tableMinStep) {
    const inp = document.createElement("input"); inp.id = "tableMinStep"; inp.type = "hidden"; inp.value = "10";
    document.body.appendChild(inp); ui.tableMinStep = inp;
  }
})();

const SVG_NS = "http://www.w3.org/2000/svg";
let cumulativeRotation = 0;
let currentAngle = null;
let currentSpeed = null;
let currentTemp = null;
let historyPoints = [];
let tableRows = [];

function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

/* ======================= КОМПАС ======================= */
const DIR = { W: 400, H: 330, cx: 200, cy: 165, R: 155 };
function dirPolar(deg, r) {
  const a = (deg - 90) * Math.PI / 180;
  return [DIR.cx + r * Math.cos(a), DIR.cy + r * Math.sin(a)];
}
function buildNeedle() {
  const { cx, cy, R } = DIR;
  const f = (n) => n.toFixed(2);
  let ticks = "";
  for (let d = 0; d < 360; d += 10) {
    const major = d % 90 === 0, mid = !major && d % 30 === 0;
    const r1 = R - (major ? 15 : (mid ? 11 : 7));
    const [x1, y1] = dirPolar(d, r1), [x2, y2] = dirPolar(d, R);
    const stroke = d === 0 ? "#ff6b6b" : "#8b9ab8";
    const width = major ? 2.4 : (mid ? 1.6 : 1.1);
    ticks += `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"/>`;
  }
  const names = [["С",0],["СВ",45],["В",90],["ЮВ",135],["Ю",180],["ЮЗ",225],["З",270],["СЗ",315]];
  let labels = "";
  for (const [n, d] of names) {
    const card = n.length === 1;
    const [tx, ty] = dirPolar(d, R - 32);
    const fill = n === "С" ? "#ff6b6b" : (card ? "#e8edf7" : "#8b9ab8");
    labels += `<text x="${f(tx)}" y="${f(ty)}" fill="${fill}" font-size="${card ? 20 : 14}" font-weight="${card ? 700 : 500}" font-family="Segoe UI, Roboto, Arial" text-anchor="middle" dominant-baseline="middle">${n}</text>`;
  }
  const tipY = cy - R - 6, baseY = cy - R + 16, hw = 10;
  const pointer = `
    <g id="dirPointer">
      <line x1="${cx}" y1="${cy - 59}" x2="${cx}" y2="${baseY}" stroke="#ffb020" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <polygon points="${cx},${tipY} ${cx + hw},${baseY} ${cx},${baseY - 4} ${cx - hw},${baseY}"
               fill="#ffb020" stroke="#0e1421" stroke-width="1.4" stroke-linejoin="round"/>
    </g>`;
  ui.svg.innerHTML = `
    <defs><linearGradient id="dirGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38d39f"/><stop offset="0.6" stop-color="#ffb020"/><stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#2a3550" stroke-width="10"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="url(#dirGrad)" stroke-width="4" opacity="0.55"/>
    ${ticks}${labels}
    <circle cx="${cx}" cy="${cy}" r="58" fill="#141b2b" stroke="#2a3550" stroke-width="1.5"/>
    <text id="dirNum" x="${cx}" y="${cy - 5}" fill="#ffb020" font-size="46" font-weight="700" font-family="Segoe UI, Roboto, Arial" text-anchor="middle" dominant-baseline="middle">—</text>
    <text id="dirCap" x="${cx}" y="${cy + 30}" fill="#8b9ab8" font-size="16" letter-spacing="1.5" font-family="Segoe UI, Roboto, Arial" text-anchor="middle">—</text>
    ${pointer}`;
  const g = ui.svg.querySelector("#dirPointer");
  if (g) g.style.transform = `rotate(${cumulativeRotation}deg)`;
  if (currentAngle !== null) setDirText(currentAngle);
}
function setDirText(angle) {
  const grad = Math.round(angle) % 360;
  const idx = Math.round(angle / 22.5) % 16;
  const num = ui.svg.querySelector("#dirNum"), cap = ui.svg.querySelector("#dirCap");
  if (num) num.textContent = `${grad}°`;
  if (cap) cap.textContent = RU[idx];
  if (ui.value) ui.value.innerHTML = `${grad}<small>°</small>`;
  if (ui.dialDeg) ui.dialDeg.textContent = `${grad}°`;
  if (ui.dirText) ui.dirText.textContent = RU[idx];
}
function drawCompass(angle) {
  if (angle === null || !Number.isFinite(angle)) return;
  const base = Number(ui.needleBase.value) || 0;
  const target = angle + base;
  const delta = ((target - cumulativeRotation) % 360 + 540) % 360 - 180;
  cumulativeRotation += delta;
  currentAngle = angle;
  const g = ui.svg.querySelector("#dirPointer");
  if (g) g.style.transform = `rotate(${cumulativeRotation}deg)`;
  setDirText(angle);
}

/* ======================= СПИДОМЕТР ======================= */
function buildSpeedometer() {
  const W = 400, H = 330, cx = W / 2, cy = H * 0.78, R = 155;
  const START = -110, END = 110;
  const max = Math.max(1, Number(ui.speedMax.value) || 50);
  const red = clamp(Number(ui.speedRed.value) || Math.round(max * 0.6), 0, max);
  const polar = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const arcPath = (fromDeg, toDeg, r) => {
    const [x1, y1] = polar(fromDeg, r), [x2, y2] = polar(toDeg, r);
    const large = Math.abs(toDeg - fromDeg) > 180 ? 1 : 0;
    const sweep = toDeg > fromDeg ? 1 : 0;
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r.toFixed(2)} ${r.toFixed(2)} 0 ${large} ${sweep} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  };
  const valToDeg = (v) => START + (clamp(v, 0, max) / max) * (END - START);
  let ticks = "";
  const step = max <= 20 ? 1 : (max <= 50 ? 5 : 10);
  for (let v = 0; v <= max + 1e-9; v += step) {
    const deg = valToDeg(v);
    const isMajor = (v % (step * 2) === 0) || v === 0 || Math.abs(v - max) < 1e-6;
    const r1 = R - (isMajor ? 14 : 8);
    const [x1, y1] = polar(deg, r1), [x2, y2] = polar(deg, R);
    const stroke = v >= red ? "#ff6b6b" : "#8b9ab8";
    const width = isMajor ? 2.2 : 1.1;
    ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"/>`;
    if (isMajor) {
      const [tx, ty] = polar(deg, R - 30);
      ticks += `<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#c9d2e0" font-size="14" font-family="Segoe UI, Roboto, Arial" text-anchor="middle" dominant-baseline="middle">${v}</text>`;
    }
  }
  const redFrom = valToDeg(red);
  const redArc = red < max
    ? `<path d="${arcPath(redFrom, END, R - 3)}" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" opacity="0.85"/>`
    : "";
  ui.speedSvg.innerHTML = `
    <defs><linearGradient id="spdGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38d39f"/><stop offset="0.6" stop-color="#ffb020"/><stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient></defs>
    <path d="${arcPath(START, END, R)}" fill="none" stroke="#2a3550" stroke-width="10" stroke-linecap="round"/>
    <path d="${arcPath(START, END, R)}" fill="none" stroke="url(#spdGrad)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    ${redArc}${ticks}
    <circle cx="${cx}" cy="${cy}" r="10" fill="#1d2740" stroke="#4a6ea8" stroke-width="1.6"/>
    <circle cx="${cx}" cy="${cy}" r="3.4" fill="#ffb020"/>`;
}
function drawSpeed(value) {
  const max = Math.max(1, Number(ui.speedMax.value) || 50);
  const W = 400, H = 330, cx = W / 2, cy = H * 0.78, R = 155;
  const START = -110, END = 110;
  const unit = ui.speedUnit.value === "kmh" ? "км/ч" : "м/с";
  let needle = ui.speedSvg.querySelector("#speedNeedle");
  if (value === null || !Number.isFinite(value)) {
    if (needle) needle.remove();
    ui.speedNum.innerHTML = `—<small id="speedUnitSmall">${unit}</small>`;
    return;
  }
  const v = clamp(value, 0, max);
  const deg = START + (v / max) * (END - START);
  const rad = (deg - 90) * Math.PI / 180;
  const len = R - 34;
  const x = cx + len * Math.cos(rad), y = cy + len * Math.sin(rad);
  const backLen = 16;
  const bx = cx - backLen * Math.cos(rad), by = cy - backLen * Math.sin(rad);
  if (!needle) {
    needle = document.createElementNS(SVG_NS, "g");
    needle.setAttribute("id", "speedNeedle");
    needle.innerHTML = `<line x1="${bx}" y1="${by}" x2="${x}" y2="${y}" stroke="#ffb020" stroke-width="4.2" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6.5" fill="#ffb020"/>`;
    ui.speedSvg.appendChild(needle);
  } else {
    const line = needle.querySelector("line");
    line.setAttribute("x1", bx); line.setAttribute("y1", by);
    line.setAttribute("x2", x);  line.setAttribute("y2", y);
  }
  const shown = ui.speedUnit.value === "kmh" ? value * 3.6 : value;
  const decimals = shown < 10 ? 1 : 0;
  ui.speedNum.innerHTML = `${shown.toFixed(decimals)}<small id="speedUnitSmall">${unit}</small>`;
}

/* ======================= ГРАФИК ======================= */
function buildTemperatureChart() {
  const W = 1000, H = 260, padL = 44, padR = 16, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const pts = historyPoints;
  const hasData = pts.length >= 2;
  let vmin = -10, vmax = 30;
  if (hasData) {
    vmin = Infinity; vmax = -Infinity;
    for (const p of pts) { if (p.v < vmin) vmin = p.v; if (p.v > vmax) vmax = p.v; }
    if (vmax - vmin < 1) { vmax += 0.5; vmin -= 0.5; }
    const pad = (vmax - vmin) * 0.12; vmin -= pad; vmax += pad;
  }
  let tmin = 0, tmax = 1;
  if (hasData) {
    tmin = pts[0].t; tmax = pts[pts.length - 1].t;
    if (tmax - tmin < 1000) tmax = tmin + 1000;
  }
  const xOf = (t) => padL + ((t - tmin) / (tmax - tmin)) * plotW;
  const yOf = (v) => padT + (1 - (v - vmin) / (vmax - vmin)) * plotH;
  const yToC = (v) => ui.tempUnit.value === "f" ? v * 9 / 5 + 32 : v;
  const unitLabel = ui.tempUnit.value === "f" ? "°F" : "°C";
  let svg = "";
  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const v = vmin + (i / yTicks) * (vmax - vmin), y = yOf(v);
    svg += `<line x1="${padL}" y1="${y.toFixed(2)}" x2="${W - padR}" y2="${y.toFixed(2)}" stroke="#233052" stroke-width="1"/>`;
    svg += `<text x="${padL - 8}" y="${y.toFixed(2)}" fill="#8b9ab8" font-size="12" font-family="Segoe UI, Roboto, Arial" text-anchor="end" dominant-baseline="middle">${yToC(v).toFixed((vmax - vmin) < 6 ? 1 : 0)}°</text>`;
  }
  if (hasData) {
    const fmt = (t) => { const d = new Date(t);
      const hm = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      return d.toDateString() === new Date().toDateString() ? hm
        : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + hm; };
    const xs = [{ t: tmin, a: "start" }, { t: (tmin + tmax) / 2, a: "middle" }, { t: tmax, a: "end" }];
    for (const x of xs) {
      const px = xOf(x.t);
      svg += `<text x="${px.toFixed(2)}" y="${H - 8}" fill="#8b9ab8" font-size="12" font-family="Segoe UI, Roboto, Arial" text-anchor="${x.a}">${fmt(x.t)}</text>`;
    }
  }
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="#3b4d78" stroke-width="1.2"/>`;
  svg += `<line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#3b4d78" stroke-width="1.2"/>`;
  if (hasData) {
    const y0 = yOf(0); const y0c = Math.min(H-padB, Math.max(padT, y0));
    const line = pts.map((p) => `${xOf(p.t).toFixed(2)},${yOf(p.v).toFixed(2)}`).join(" ");
    const f = pts[0], l2 = pts[pts.length-1];
    const area = `${xOf(f.t).toFixed(2)},${y0c.toFixed(2)} ` + line + ` ${xOf(l2.t).toFixed(2)},${y0c.toFixed(2)}`;
    svg += `<defs><linearGradient id="tfMain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b" stop-opacity="0.38"/><stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/></linearGradient></defs>`;
    svg += `<polygon points="${area}" fill="url(#tfMain)" stroke="none"/>`;
    svg += `<polyline points="${line}" fill="none" stroke="#ff6b6b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (y0 > padT && y0 < H-padB) svg += `<line x1="${padL}" y1="${y0.toFixed(2)}" x2="${W-padR}" y2="${y0.toFixed(2)}" stroke="#6b7fa0" stroke-width="1" stroke-dasharray="4 3"/>`;
    const last = pts[pts.length-1];
    svg += `<circle cx="${xOf(last.t).toFixed(2)}" cy="${yOf(last.v).toFixed(2)}" r="4" fill="#ff6b6b" stroke="#0e1421" stroke-width="1.5"/>`;
  } else {
    svg += `<text x="${W / 2}" y="${H / 2}" fill="#5b6b8e" font-size="16" font-family="Segoe UI, Roboto, Arial" text-anchor="middle">нет данных для графика</text>`;
  }
  ui.tempSvg.innerHTML = svg;
  if (hasData) {
    const last = pts[pts.length - 1];
    const shown = yToC(last.v);
    ui.chartLast.style.color = "#ff6b6b";
    ui.chartLast.innerHTML = `${shown.toFixed(1)}<small>${unitLabel}</small>`;
  } else {
    ui.chartLast.innerHTML = `—<small>${unitLabel}</small>`;
  }
}

/* ======================= ТАБЛИЦА ======================= */
function renderTable() {
  const kmh = ui.speedUnit.value === "kmh";
  const fahr = ui.tempUnit.value === "f";
  const mmhg = ui.pressUnit.value === "mmhg";
  ui.thTemp.textContent = `Темп., ${fahr ? "°F" : "°C"}`;
  ui.thSpeed.textContent = `Скор., ${kmh ? "км/ч" : "м/с"}`;
  ui.thPress.textContent = `Давл., ${mmhg ? "мм" : "гПа"}`;
  const stepMin = Number(ui.tableStep.value) || 0;
  const stepMs = stepMin > 0 ? stepMin * 60000 : 10000;
  let rows = tableRows;
  const seen = new Map();
  rows = rows.filter((r) => {
    const k = Math.floor(r.t / stepMs);
    if (seen.has(k)) return false;
    seen.set(k, true);
    return true;
  });
  if (!rows.length) {
    ui.tableBody.innerHTML = '<tr><td class="empty" colspan="6">Нет данных за последние 6 часов</td></tr>';
    ui.tableInfo.textContent = "нет данных";
    return;
  }
  const today = new Date().toDateString();
  const pad = (n) => String(n).padStart(2, "0");
  const hms = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const out = [];
  for (const r of rows) {
    const d = new Date(r.t);
    const date = d.toDateString() === today ? "" : `<small>${pad(d.getDate())}.${pad(d.getMonth() + 1)}</small>`;
    const temp = r.temp === null ? "—" : (fahr ? r.temp * 9 / 5 + 32 : r.temp).toFixed(1);
    const speed = r.speed === null ? "—" : (kmh ? r.speed * 3.6 : r.speed).toFixed(1);
    let dir = "—";
    if (r.dir !== null) dir = `${Math.round(r.dir) % 360}°<small>${RU[Math.round(r.dir / 22.5) % 16]}</small>`;
    const press = r.press === null ? "—" : (mmhg ? r.press * 0.750064 : r.press).toFixed(1);
    const hum = r.hum === null ? "—" : r.hum.toFixed(1) + "%";
    out.push(`<tr><td class="t-time">${hms(d)}${date}</td><td class="t-temp">${temp}</td><td class="t-dir">${dir}</td><td class="t-speed">${speed}</td><td class="t-press">${press}</td><td class="t-hum">${hum}</td></tr>`);
  }
  ui.tableBody.innerHTML = out.join("");
  const hm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  let info = `с ${hm(rows[rows.length - 1].t)} по ${hm(rows[0].t)} · записей: ${rows.length}`;
  ui.tableInfo.textContent = info;
}

/* ======================= ИНИЦИАЛИЗАЦИЯ ======================= */
buildNeedle();
buildSpeedometer();

if (CUR.value != null) drawCompass(Number(CUR.value));
if (CUR.speed != null) drawSpeed(Number(CUR.speed));

historyPoints = HIST.filter((r) => r.temp != null).map((r) => ({ t: r.t, v: r.temp }));
const nChart = Math.max(10, Number(ui.tempLimit?.value) || 120);
if (historyPoints.length > nChart) historyPoints = historyPoints.slice(-nChart);
buildTemperatureChart();

tableRows = HIST.slice().reverse();
renderTable();

if (CUR.ts) {
  const t = new Date(Number(CUR.ts)).toLocaleTimeString("ru-RU");
  const spd = CUR.speed != null ? `  ·  ${CUR.speed} м/с` : "";
  const tmp = CUR.temp  != null ? `  ·  ${CUR.temp}°C`   : "";
  ui.status.textContent = `Rightech API · windDirection = ${CUR.value}${spd}${tmp}  ·  ${t}`;
  ui.status.className = "status is-ok";
  ui.badge.textContent = "онлайн";
}

/* ======================= СОБЫТИЯ ======================= */
ui.tableToggle.addEventListener("click", () => {
  const open = !ui.tableCard.classList.contains("open");
  ui.tableCard.classList.toggle("open", open);
  ui.tableToggle.setAttribute("aria-expanded", String(open));
});
ui.tableStep.addEventListener("change", renderTable);
</script>
